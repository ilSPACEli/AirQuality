# Опис endpoints у форматі OpenAPI. Спільні схеми, параметри та відповіді
# (усе, на що посилається $ref) визначено у swagger.js.
paths:
  /health:
    get:
      tags: [Service]
      summary: Стан сервісу та з'єднання з базою даних
      responses:
        200: { description: Сервіс працює }
        503: { description: База даних недоступна }

  /stations:
    get:
      tags: [Stations]
      summary: Список станцій моніторингу
      parameters:
        - { in: query, name: city, schema: { type: string }, description: Фільтр за містом (без урахування регістру) }
        - { in: query, name: active, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        200:
          description: Колекція станцій (порожня колекція теж 200)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { type: array, items: { $ref: '#/components/schemas/Station' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        422: { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Stations]
      summary: Зареєструвати нову станцію
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StationCreate' }
      responses:
        201:
          description: Станцію створено, заголовок Location містить її адресу
          headers:
            Location: { schema: { type: string, example: /api/v1/stations/KYIV-01 } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationResponse' }
        400: { $ref: '#/components/responses/BadRequest' }
        409: { $ref: '#/components/responses/Conflict' }
        422: { $ref: '#/components/responses/ValidationError' }

  /stations/{id}:
    parameters:
      - { $ref: '#/components/parameters/StationCode' }
    get:
      tags: [Stations]
      summary: Отримати станцію за кодом
      responses:
        200:
          description: Станція
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationResponse' }
        404: { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Stations]
      summary: Повністю замінити дані станції
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StationUpdate' }
      responses:
        200:
          description: Оновлена станція
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationResponse' }
        404: { $ref: '#/components/responses/NotFound' }
        422: { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Stations]
      summary: Частково оновити дані станції
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StationPatch' }
      responses:
        200:
          description: Оновлена станція
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationResponse' }
        404: { $ref: '#/components/responses/NotFound' }
        422: { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Stations]
      summary: Видалити станцію разом з її вимірюваннями
      description: Операція ідемпотентна, повторний виклик теж повертає 204.
      responses:
        204: { description: Видалено, тіла відповіді немає }

  /stations/{id}/statistics:
    get:
      tags: [Stations]
      summary: Агреговані показники станції
      description: Середнє, мінімум і максимум за кожним показником та кількість перевищень ГДК PM2.5.
      parameters:
        - { $ref: '#/components/parameters/StationCode' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        200:
          description: Статистика
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/StationStatistics' }
        404: { $ref: '#/components/responses/NotFound' }
        422: { $ref: '#/components/responses/ValidationError' }

  /stations/{id}/measurements:
    parameters:
      - { $ref: '#/components/parameters/StationCode' }
    get:
      tags: [Measurements]
      summary: Вимірювання конкретної станції
      parameters:
        - { $ref: '#/components/parameters/Pollutant' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/After' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        200:
          description: Колекція вимірювань
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasurementListResponse' }
        404: { $ref: '#/components/responses/NotFound' }
        422: { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Measurements]
      summary: Додати вимірювання до станції
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeasurementValues' }
      responses:
        201:
          description: Вимірювання створено
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasurementResponse' }
        404: { $ref: '#/components/responses/NotFound' }
        409: { $ref: '#/components/responses/Conflict' }
        422: { $ref: '#/components/responses/ValidationError' }

  /measurements:
    get:
      tags: [Measurements]
      summary: Усі вимірювання з фільтрами, сортуванням і пагінацією
      description: >
        Без параметра after працює offset-пагінація (page, limit). З параметром after
        працює курсорна пагінація за спаданням часу, значення курсора береться з meta.next_cursor.
      parameters:
        - { in: query, name: station, schema: { type: string, example: KYIV-01 } }
        - { in: query, name: city, schema: { type: string, example: Kyiv } }
        - { $ref: '#/components/parameters/Pollutant' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/After' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        200:
          description: Колекція вимірювань (порожня колекція теж 200)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasurementListResponse' }
        422: { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Measurements]
      summary: Створити вимірювання
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeasurementCreate' }
      responses:
        201:
          description: Вимірювання створено
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasurementResponse' }
        400: { $ref: '#/components/responses/BadRequest' }
        404: { $ref: '#/components/responses/NotFound' }
        409: { $ref: '#/components/responses/Conflict' }
        422: { $ref: '#/components/responses/ValidationError' }

  /measurements/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string }, description: ObjectId вимірювання }
    get:
      tags: [Measurements]
      summary: Отримати вимірювання за ідентифікатором
      responses:
        200:
          description: Вимірювання
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasurementResponse' }
        404: { $ref: '#/components/responses/NotFound' }
        422: { $ref: '#/components/responses/ValidationError' }
    put:
      tags: [Measurements]
      summary: Повністю замінити вимірювання
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeasurementCreate' }
      responses:
        200:
          description: Оновлене вимірювання
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasurementResponse' }
        404: { $ref: '#/components/responses/NotFound' }
        409: { $ref: '#/components/responses/Conflict' }
        422: { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Measurements]
      summary: Видалити вимірювання
      description: Операція ідемпотентна, повторний виклик теж повертає 204.
      responses:
        204: { description: Видалено, тіла відповіді немає }
        422: { $ref: '#/components/responses/ValidationError' }
